<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيدلية خالد محمد رجب</title>
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استدعاء مكتبة Supabase للربط السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --accent: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .file-upload-wrapper {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
        }

        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .file-upload-wrapper i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .file-upload-wrapper input {
            display: none;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #059669;
        }

        .medicines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .medicine-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .medicine-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .medicine-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .medicine-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .medicine-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .medicine-price {
            color: var(--accent);
            font-weight: 900;
            font-size: 1.15rem;
            margin-top: auto;
        }

        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 0.75rem;
            width: 100%;
        }

        .btn-delete:hover {
            background: #dc2626;
            color: white;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-house-medical"></i> صيدلية خالد محمد رجب</h1>
        <p>خدمتكم الطبية المتميزة على مدار الساعة - أدوية وعلاجات متكاملة</p>
    </header>

    <div class="container">
        <!-- نموذج إضافة دواء جديد محمي بكلمة مرور -->
        <div class="card">
            <h2><i class="fa-solid fa-capsules"></i> إضافة دواء جديد</h2>
            <form id="medicineForm">
                <div class="form-group">
                    <label for="medName">اسم الدواء</label>
                    <input type="text" id="medName" placeholder="أدخل اسم الدواء هنا..." required>
                </div>

                <div class="form-group">
                    <label for="medPrice">السعر (جنيه)</label>
                    <input type="number" id="medPrice" step="0.25" placeholder="أدخل السعر..." required>
                </div>

                <div class="form-group">
                    <label>صورة الدواء</label>
                    <label class="file-upload-wrapper" for="medImage">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <div id="uploadText">اضغط هنا لرفع صورة الدواء</div>
                        <input type="file" id="medImage" accept="image/*" required>
                    </label>
                </div>

                <div class="form-group">
                    <label for="adminPassword">كلمة مرور المدير للإضافة</label>
                    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور..." required>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fa-solid fa-plus-circle"></i> إضافة للقائمة
                </button>
            </form>
        </div>

        <!-- قسم عرض الأدوية المضافة -->
        <div class="card">
            <h2><i class="fa-solid fa-pills"></i> أدوية الصيدلية المتاحة</h2>
            <div id="medicinesContainer" class="medicines-grid">
                <div class="empty-state">
                    <i class="fa-solid fa-prescription-bottle-medical"></i>
                    <p>جاري تحميل الأدوية...</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة لصيدلية خالد محمد رجب &copy; 2026
    </footer>

    <script>
        // إعدادات الاتصال السحابي بـ Supabase
        const SUPABASE_URL = 'https://zruxjflttqtqtnfgtjcl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pfeeWhP7glSOupdwhNrVCQ_SnVjp0cu';
        
        // 🔐 كلمة المرور الخاصة بالمدير
        const ADMIN_PASSWORD = '1234'; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('medicineForm');
        const medicinesContainer = document.getElementById('medicinesContainer');
        const medImageInput = document.getElementById('medImage');
        const uploadText = document.getElementById('uploadText');
        const submitBtn = document.getElementById('submitBtn');

        // تحديث النص عند اختيار صورة
        medImageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                uploadText.textContent = `تم اختيار: ${this.files[0].name}`;
                uploadText.style.color = 'var(--accent)';
            }
        });

        // جلب الأدوية عند فتح الصفحة
        async function fetchMedicines() {
            const { data, error } = await _supabase.from('medicines').select('*').order('id', { ascending: false });
            
            if (error) {
                console.error('خطأ في جلب البيانات:', error);
                return;
            }

            medicinesContainer.innerHTML = '';

            if (data.length === 0) {
                medicinesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-prescription-bottle-medical"></i>
                        <p>لا توجد أدوية مضافة حالياً. ابدأ بإضافة أول دواء!</p>
                    </div>
                `;
                return;
            }

            data.forEach(med => {
                const medicineCard = document.createElement('div');
                medicineCard.className = 'medicine-card';
                medicineCard.innerHTML = `
                    <img src="${med.image_url}" alt="${med.name}" class="medicine-img">
                    <div class="medicine-info">
                        <div class="medicine-name">${med.name}</div>
                        <div class="medicine-price">${med.price} ج.م</div>
                        <button onclick="deleteMedicine(${med.id}, '${med.image_url}')" class="btn-delete">
                            <i class="fa-solid fa-trash"></i> حذف الدواء
                        </button>
                    </div>
                `;
                medicinesContainer.appendChild(medicineCard);
            });
        }

        // إضافة دواء جديد وحفظه سحابياً مع التحقق من كلمة المرور
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const enteredPassword = document.getElementById('adminPassword').value;
            
            if (enteredPassword !== ADMIN_PASSWORD) {
                alert('كلمة المرور غير صحيحة! غير مسموح لك بإضافة أدوية.');
                return;
            }

            const name = document.getElementById('medName').value;
            const price = document.getElementById('medPrice').value;
            const imageFile = medImageInput.files[0];

            if (!imageFile) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                // 1. رفع الصورة إلى Supabase Storage
                const fileName = `${Date.now()}_${imageFile.name}`;
                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('medicines-images')
                    .upload(fileName, imageFile);

                if (uploadError) throw uploadError;

                // 2. الحصول على الرابط العام للصورة
                const { data: publicUrlData } = _supabase.storage
                    .from('medicines-images')
                    .getPublicUrl(fileName);

                const imageUrl = publicUrlData.publicUrl;

                // 3. حفظ بيانات الدواء في الجدول (Database)
                const { error: insertError } = await _supabase
                    .from('medicines')
                    .insert([{ name, price: parseFloat(price), image_url: imageUrl }]);

                if (insertError) throw insertError;

                // إعادة ضبط الفورم وتحديث القائمة
                form.reset();
                uploadText.textContent = 'اضغط هنا لرفع صورة الدواء';
                uploadText.style.color = 'var(--text-muted)';
                fetchMedicines();

            } catch (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-plus-circle"></i> إضافة للقائمة';
            }
        });

        // دالة حذف الدواء المحمية بكلمة مرور
        async function deleteMedicine(id, imageUrl) {
            const enteredPassword = prompt('أدخل كلمة مرور المدير للحذف:');
            
            if (enteredPassword === null) return;

            if (enteredPassword !== ADMIN_PASSWORD) {
                alert('كلمة المرور غير صحيحة! لا يمكنك حذف هذا الدواء.');
                return;
            }

            try {
                // 1. حذف الدواء من جدول الـ Database
                const { error: dbError } = await _supabase
                    .from('medicines')
                    .delete()
                    .eq('id', id);

                if (dbError) throw dbError;

                // 2. محاولة حذف الصورة من الـ Storage
                try {
                    const urlParts = imageUrl.split('/');
                    const fileName = urlParts[urlParts.length - 1];
                    await _supabase.storage.from('medicines-images').remove([fileName]);
                } catch (err) {
                    console.log('ملاحظة: لم يتم حذف الصورة من الـ Storage');
                }

                // تحديث القائمة فوراً
                fetchMedicines();
                alert('تم حذف الدواء بنجاح.');

            } catch (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
            }
        }

        // تشغيل الدالة عند تحميل الصفحة
        fetchMedicines();
    </script>
</body>
</html>
